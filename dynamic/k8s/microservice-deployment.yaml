apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-microservice
  namespace: default
  labels:
    app.kubernetes.io/name: payment-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-microservice
  template:
    metadata:
      labels:
        app: payment-microservice
      annotations:
        # Enable Vault Agent Injector Sidecar
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "payment-service"
        
        # Dynamic Secret Path from HashiCorp Vault Database Secrets Engine
        vault.hashicorp.com/agent-inject-secret-db-creds: "database/creds/payment-service-role"
        
        # Inject formatted environment/config file directly into container volume (/vault/secrets/db-creds)
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "database/creds/payment-service-role" -}}
          DB_USER="{{ .Data.username }}"
          DB_PASSWORD="{{ .Data.password }}"
          LEASE_ID="{{ .LeaseID }}"
          LEASE_DURATION="{{ .LeaseDuration }}"
          {{- end -}}
    spec:
      serviceAccountName: payment-service-sa
      containers:
        - name: payment-api
          image: dynamic-poc-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_HOST
              value: "postgres-service.default.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ecommerce_db"
            - name: CREDENTIALS_FILE
              value: "/vault/secrets/db-creds"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: payment-microservice

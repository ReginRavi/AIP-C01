networks:
  vault-transit-net:
    driver: bridge

volumes:
  main_vault_data:

services:
  # ----------------------------------------------------------------------------
  # 1. Transit Vault Server (Acts as Centralized KMS / Auto-Unseal Provider)
  # ----------------------------------------------------------------------------
  transit-vault-server:
    image: hashicorp/vault:1.16.0
    container_name: transit-vault-server
    restart: unless-stopped
    networks:
      - vault-transit-net
    ports:
      - "8100:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "transit-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. Transit Provisioner: Prepares Transit Engine, Key, Policy, and Token
  # ----------------------------------------------------------------------------
  transit-vault-provisioner:
    image: hashicorp/vault:1.16.0
    container_name: transit-vault-provisioner
    restart: "no"
    networks:
      - vault-transit-net
    depends_on:
      transit-vault-server:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://transit-vault-server:8200"
      VAULT_TOKEN: "transit-root-token"
    volumes:
      - ./transit-vault/init-transit.sh:/init-transit.sh:ro
    entrypoint: ["/bin/sh", "/init-transit.sh"]

  # ----------------------------------------------------------------------------
  # 3. Main Vault Server (Auto-Unsealed Target Vault using Transit KMS)
  # ----------------------------------------------------------------------------
  main-vault-server:
    image: hashicorp/vault:1.16.0
    container_name: main-vault-server
    restart: unless-stopped
    networks:
      - vault-transit-net
    ports:
      - "8220:8200"
    depends_on:
      transit-vault-provisioner:
        condition: service_completed_successfully
    volumes:
      - ./target-vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - main_vault_data:/vault/data
    cap_add:
      - IPC_LOCK
    entrypoint: ["vault", "server", "-config=/vault/config/vault.hcl"]
